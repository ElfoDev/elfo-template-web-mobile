name: CI

on:
  pull_request:
  push:
    branches: [production, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, build and doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Jest transform cache for apps/app (cacheDirectory in its jest config). A cold run
      # transforms React Native + Expo Router with Babel (~25s); warm it is ~3s. Keyed on
      # everything that changes the transformed output, so stale entries never pile up.
      - name: Restore Jest cache
        uses: actions/cache@v6
        with:
          path: apps/app/node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/app/package.json', 'apps/app/babel.config.js', 'apps/app/tailwind.config.js') }}

      - name: Check (lint + typecheck + test)
        run: pnpm check

      - name: Build (Expo web export + Worker dry-run bundle)
        run: pnpm build

      - name: Expo doctor
        run: pnpm --filter @repo/app run doctor
