name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, build and doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check (lint + typecheck + test)
        run: pnpm check

      - name: Build (API dry-run bundle + Expo web export)
        run: pnpm build

      - name: Expo doctor
        run: pnpm --filter @repo/app run doctor
