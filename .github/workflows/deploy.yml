# Publishes the app on Cloudflare Workers: one Worker per environment serves the web app
# (Expo web export) and the API under /api, with a Neon Postgres database.
#
#   push to `production` -> GitHub environment `production`, Worker <name>,         Neon default branch
#   push to `staging`    -> GitHub environment `staging`,    Worker <name>-staging, Neon branch `staging`
#
# `staging` is optional: without that branch nothing deploys there. Elfo writes the secrets
# (Board -> Settings -> Deploy) and starts the first run itself (workflow_dispatch).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATABASE_URL, DATABASE_URL_POOLED,
# NEON_API_KEY, NEON_PROJECT_ID, plus the app's own from foreman.json `secrets[]`.
# Variables (optional): CLOUDFLARE_WORKER_NAME, CUSTOM_DOMAIN, STAGING_CUSTOM_DOMAIN.
name: Deploy

on:
  push:
    branches: [production, staging]
  workflow_dispatch:

permissions:
  contents: read

# One deploy per environment at a time. A running deploy is never cancelled; a newer push
# waits for it (and replaces an older one still waiting).
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  target:
    name: Target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      skip: ${{ steps.template.outputs.ready == 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Environment from the branch
        id: target
        env:
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: .github/scripts/deploy-target.sh "$BRANCH" "$REF_TYPE"

      # The template repository itself has no Cloudflare account: skip instead of failing
      # (and without creating a deployment). Repositories made from it check in the deploy job.
      - name: Template repository without Cloudflare
        id: template
        if: github.event.repository.is_template
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_IF_MISSING: "true"
        run: .github/scripts/require-cloudflare-secrets.sh

  deploy:
    name: Deploy (${{ needs.target.outputs.environment }})
    needs: target
    if: needs.target.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Elfo reads the deployments of `production` and `staging` (and this URL) for the board.
    environment:
      name: ${{ needs.target.outputs.environment }}
      url: ${{ steps.urls.outputs.url }}
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      WRANGLER_SEND_METRICS: false
      ENVIRONMENT_NAME: ${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .github/scripts/require-cloudflare-secrets.sh

      - name: Worker name and domain
        id: worker
        env:
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          CUSTOM_DOMAIN: ${{ needs.target.outputs.environment == 'staging' && vars.STAGING_CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN }}
        run: |
          suffix=""
          [ "$ENVIRONMENT_NAME" = "production" ] || suffix="-$ENVIRONMENT_NAME"
          name="$(.github/scripts/worker-name.sh "$REPO_NAME" "$suffix")"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          domain="${CUSTOM_DOMAIN#https://}"
          echo "domain=${domain%/}" >>"$GITHUB_OUTPUT"
          echo "Worker: $name${CUSTOM_DOMAIN:+ (domínio: $CUSTOM_DOMAIN)}"

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Jest cache
        uses: actions/cache@v6
        with:
          path: apps/app/node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/app/package.json', 'apps/app/babel.config.js', 'apps/app/tailwind.config.js') }}

      - name: Check (lint + typecheck + test)
        run: pnpm check

      - name: Build (Expo web export + Worker bundle)
        run: pnpm build

      - name: Database
        id: db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: .github/scripts/database-urls.sh "$ENVIRONMENT_NAME"

      # Before the new Worker version goes live, so it never runs against an old schema.
      # Migrations must stay backward compatible: the previous version serves until the deploy.
      - name: Migrations
        env:
          DATABASE_URL: ${{ steps.db.outputs.direct_url }}
        run: pnpm db:migrate

      # Each app secret by name (the ones in foreman.json): never all secrets at once, which GitHub
      # holds for approval in public repositories. A new app secret goes here, in preview.yml and in
      # foreman.json.
      - name: Worker secrets
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          DATABASE_URL: ${{ steps.db.outputs.pooled_url }}
        run: .github/scripts/worker-secrets.sh foreman.json "$RUNNER_TEMP/worker-secrets.json"

      - name: Deploy (wrangler deploy)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ steps.worker.outputs.name }}
          CUSTOM_DOMAIN: ${{ steps.worker.outputs.domain }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          args=(deploy --name "$WORKER_NAME" --secrets-file "$RUNNER_TEMP/worker-secrets.json"
            --message "${GITHUB_SHA::7} ($ENVIRONMENT_NAME)")
          [ -z "$CUSTOM_DOMAIN" ] || args+=(--domain "$CUSTOM_DOMAIN")
          pnpm exec wrangler "${args[@]}"

      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"

      # `workers_dev_url` is what the smoke test hits (always there, no DNS to wait for).
      # `url` (the environment's) is the custom domain when there is one.
      - name: Published URLs
        id: urls
        env:
          OUTPUT_FILE: ${{ runner.temp }}/wrangler-output.json
        run: |
          targets="$(jq -r 'select(.type == "deploy") | .targets[]?' "$OUTPUT_FILE" 2>/dev/null || true)"
          workers_dev="$(grep -oE '^https://[a-z0-9.-]+\.workers\.dev$' <<<"$targets" | head -n1 || true)"
          custom="$(grep -oE '^[a-z0-9.-]+ \(custom domain' <<<"$targets" | head -n1 | cut -d' ' -f1 || true)"
          if [ -z "$workers_dev" ]; then
            echo "::error title=URL do workers.dev não encontrada::Confira se 'workers_dev' está true em apps/api/wrangler.jsonc e se a conta tem um subdomínio workers.dev (painel da Cloudflare → Workers & Pages)."
            exit 1
          fi
          url="${custom:+https://$custom}"
          url="${url:-$workers_dev}"
          echo "workers_dev_url=$workers_dev" >>"$GITHUB_OUTPUT"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          {
            echo "## 🚀 Publicado em $ENVIRONMENT_NAME"
            echo
            echo "- App: $url"
            echo "- API: $url/api/health"
            [ "$url" = "$workers_dev" ] || echo "- workers.dev: $workers_dev"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Smoke test (web app + API + database)
        env:
          URL: ${{ steps.urls.outputs.workers_dev_url }}
        run: .github/scripts/smoke-test.sh "$URL"
